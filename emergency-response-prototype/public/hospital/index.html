<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dispatch Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">
        <header>
            <h1>🏥 City Care Hospital — Emergency Control</h1>
            <button id="refreshBtn">🔄 Refresh Alerts</button>
        </header>

        <main class="grid-layout">
            <section class="panel">
                <h2>Incoming SOS Alerts</h2>
                <div id="alertsContainer" class="card-list">
                    <p class="empty-text">No active SOS alerts.</p>
                </div>
            </section>

            <section class="panel">
                <h2>Available Ambulances</h2>
                <div id="ambulancesContainer" class="card-list">
                    <p class="empty-text">Fetching ambulances...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
