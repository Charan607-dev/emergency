<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dispatch Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>🚑 Driver Terminal</h2>
            <p class="subtitle">Select your vehicle to view assigned pickups.</p>

            <div class="driver-select">
                <label for="ambulanceSelect">Select Vehicle:</label>
                <select id="ambulanceSelect">
                    <option value="amb_101">KA-01-EQ-1234 (Ramesh)</option>
                    <option value="amb_102">KA-01-EQ-5678 (Suresh)</option>
                </select>
            </div>

            <div id="statusBox" class="status-box available">
                <span class="dot"></span>
                <strong id="statusText">Status: AVAILABLE</strong>
            </div>

            <div id="assignmentDetails" class="assignment-card hidden">
                <h3>🚨 Active Pickup Assigned!</h3>
                <p><strong>Patient:</strong> <span id="patientName">-</span></p>
                <p><strong>Phone:</strong> <span id="patientPhone">-</span></p>
                <p><strong>Location:</strong> <span id="patientLoc">-</span></p>

                <button id="completeBtn" class="complete-btn">Mark as Reached & Available</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
