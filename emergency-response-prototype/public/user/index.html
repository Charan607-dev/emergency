<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency SOS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>Emergency Help</h2>
            <p class="subtitle">Press and hold the button below to send an emergency alert to City Care Hospital.</p>

            <div class="user-info">
                <label>Your Name:</label>
                <input type="text" id="userName" value="Arun Kumar">
                <label>Phone Number:</label>
                <input type="text" id="userPhone" value="9876543210">
            </div>

            <button id="sosBtn" class="sos-button">
                <span>TRIGGER SOS</span>
            </button>

            <div id="statusContainer" class="status-box hidden">
                <div id="statusSpinner" class="spinner"></div>
                <p id="statusMessage">Sending emergency location...</p>
                <div id="ambulanceDetails" class="ambulance-card hidden"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
